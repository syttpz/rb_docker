apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rtabmap-offload-data
  namespace: hsrn-robot
  labels:
    app: rtabmap-offload

spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 60Gi
  # No storageClassName -> the cluster default is used. If the PVC sits in
  # Pending after apply, the cluster has no default class; check
  #   kubectl get storageclass
  # and pin one here.

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: rtabmap-offload
  namespace: hsrn-robot
  labels:
    app: rtabmap-offload

spec:
  replicas: 1

  # The PVC is ReadWriteOnce, so it can only be mounted by one node at a time.
  # Under the default RollingUpdate the new pod is created *before* the old one
  # is torn down, so it waits for a volume the old pod still holds while the old
  # pod waits for the new one to become ready -- a deadlock on every redeploy.
  # Recreate terminates the old pod first. Safe here because replicas is 1 and
  # this is a batch-style workload with no availability requirement.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: rtabmap-offload

  template:
    metadata:
      labels:
        app: rtabmap-offload

    spec:
      # rtabmap flushes its database on SIGTERM; don't cut that short.
      terminationGracePeriodSeconds: 60

      containers:
        - name: rtabmap-offload
          # Pinned by digest so a rebuilt tag can never silently change what a
          # run was measured against (md/thesis-research-plan.md §7).
          # Drop the @sha256 suffix if you just want "whatever is on that tag".
          image: eddyhu217/offload:2026-08-17-control-keepalive@sha256:d945644054e45838dda4b74e20fdb549d1065ac9f5337a54f38ebd26a0f60ce6
          imagePullPolicy: IfNotPresent

          env:
            - name: ROS_DOMAIN_ID
              value: "0"
            # udp works from here as long as the receiver's NAT mapping is
            # held open, which the bridge now does itself (corelink.keepalive_s,
            # default 10 s). Measured: ~1 s from receiver-ready to first packet
            # arrives, ~45 s does not. Switch to ws/tcp only if something makes
            # the keepalive insufficient -- they are outbound connections, so
            # they would sidestep the mapping entirely at the cost of no longer
            # measuring UDP.
            # - name: CORELINK_PROTOCOL
            #   value: "ws"
            # Names the database as /root/.ros/rtabmap_<RUN_ID>.db. Left unset
            # so each pod start falls back to a launch-time timestamp and never
            # overwrites a previous run; set it to pin a meaningful id for one
            # experiment, but remember to change it before re-running.
            # - name: RUN_ID
            #   value: "n0-udp-raw-01"

          # rgbd_odometry and rtabmap are both CPU-bound. Without a request the
          # scheduler treats this as best-effort and it gets throttled first
          # under contention on a shared cluster.
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi

          volumeMounts:
            - name: rtabmap-data
              mountPath: /root/.ros

      volumes:
        - name: rtabmap-data
          persistentVolumeClaim:
            claimName: rtabmap-offload-data
